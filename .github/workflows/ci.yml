# Checks that run on every push and pull request (and before every deploy, see deploy.yml).
name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r backend/requirements.txt pytest "moto[s3]"
      - name: Tests (login, cleaning of text, uploads to local folders and S3, production settings)
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: |
          set -e
          for f in frontend/js/*.js frontend/admin/*.js deploy/amplify/*.js; do node --check "$f"; echo "ok $f"; done
      - name: The Amplify build step writes a valid env-config.js
        run: |
          set -e
          LOKMANGAL_API_BASE=https://api.example.com LOKMANGAL_PDF_BASE=https://media.example.com/pdf node deploy/amplify/write-env-config.js
          node -e "global.window={};require('./frontend/js/env-config.js');const e=window.LOKMANGAL_ENV;if(e.API_BASE!=='https://api.example.com'||e.PDF_BASE!=='https://media.example.com/pdf/')process.exit(1)"
          git checkout -- frontend/js/env-config.js

  infrastructure:
    name: Infrastructure files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CloudFormation templates
        run: pip install cfn-lint && cfn-lint deploy/aws/*.yml
      - name: Shell scripts
        run: |
          set -e
          sudo apt-get install -y shellcheck >/dev/null
          for f in deploy/ec2/*.sh deploy/docker/*.sh; do bash -n "$f"; shellcheck -S error "$f"; echo "ok $f"; done
      - name: The API image builds
        run: docker build -t lokportal-api:ci backend
