# Deploys when something is pushed to main - after the CI checks passed:
#   website  -> AWS Amplify, TWO sites from one push (a zip of each is uploaded; GitHub signs in to AWS with OIDC: no AWS key is stored):
#                 branch "main"  = the public website (frontend/ without the admin panel)  -> https://www.lokmangal.info
#                 branch "admin" = the admin panel only (its own address, its own browser origin) -> https://admin.lokmangal.info
#   backend  -> the EC2 server (a tar.gz of backend/ goes over SSH to /opt/lokportal/deploy-entry.sh, which builds the image, applies
#               additive database changes, switches the container and rolls back by itself when the new version does not answer).
#               Needs the repository secrets DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS (see deploy/SHARED-SERVER.md); without them this job only prints a note.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::888544051752:role/lokportal-github-deploy
  AMPLIFY_APP_ID: d3c5tglr8un3e
  # (checked after every deploy through Amplify's own addresses, so a DNS problem can not fail a deploy)
  SITE_URL: https://main.d3c5tglr8un3e.amplifyapp.com
  ADMIN_URL: https://admin.d3c5tglr8un3e.amplifyapp.com
  # public values: the addresses the pages use
  LOKMANGAL_API_BASE: https://api.lokmangal.info
  SITE_BASE: https://www.lokmangal.info
  SERVER_HOST: 13.205.79.72

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  website:
    name: Website + Admin -> Amplify
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # (the AWS role trusts exactly: this repository, branch main. A job with `environment:` would present a different identity.)
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build the two sites
        run: |
          set -euo pipefail
          rm -rf build && mkdir -p build/site build/admin
          # public website: everything except the admin panel (a small page sends old /admin/ bookmarks to the admin address)
          rsync -a --exclude '/admin/' frontend/ build/site/
          mkdir -p build/site/admin && cp deploy/amplify/admin-moved.html build/site/admin/index.html
          node deploy/amplify/write-env-config.js build/site/js/env-config.js
          # admin panel: only what it needs - its own files, the settings and the logo. (The pictures of the news are read from the website.)
          mkdir -p build/admin/admin build/admin/js build/admin/assets
          cp frontend/admin/* build/admin/admin/
          cp frontend/js/config.js build/admin/js/
          cp frontend/assets/logo-icon.png build/admin/assets/
          cp deploy/amplify/admin-root.html build/admin/index.html
          printf 'User-agent: *\nDisallow: /\n' > build/admin/robots.txt
          LOKMANGAL_SITE_BASE="$SITE_BASE" node deploy/amplify/write-env-config.js build/admin/js/env-config.js
          echo "site files: $(find build/site -type f | wc -l)   admin files: $(find build/admin -type f | wc -l)"

      - name: Security and cache headers (customHttp.yml is the source of truth)
        run: aws amplify update-app --app-id "$AMPLIFY_APP_ID" --custom-headers "$(cat customHttp.yml)" --query 'app.appId' --output text

      - name: Upload and publish both sites
        run: |
          set -euo pipefail
          deploy() {   # $1 = Amplify branch, $2 = folder
            (cd "$2" && zip -qr "../$1.zip" .)
            read -r JOB_ID UPLOAD_URL < <(aws amplify create-deployment --app-id "$AMPLIFY_APP_ID" --branch-name "$1" --query '[jobId,zipUploadUrl]' --output text)
            curl --fail --silent --show-error -T "build/$1.zip" "$UPLOAD_URL"
            aws amplify start-deployment --app-id "$AMPLIFY_APP_ID" --branch-name "$1" --job-id "$JOB_ID" --query 'jobSummary.status' --output text
            local STATUS=""
            for i in $(seq 1 60); do
              STATUS=$(aws amplify get-job --app-id "$AMPLIFY_APP_ID" --branch-name "$1" --job-id "$JOB_ID" --query 'job.summary.status' --output text)
              echo "$1 deployment $JOB_ID: $STATUS"
              case "$STATUS" in
                SUCCEED) return 0 ;;
                FAILED|CANCELLED) echo "::error::Amplify deployment of $1 $STATUS"; return 1 ;;
              esac
              sleep 10
            done
            echo "::error::Amplify deployment of $1 did not finish in time"; return 1
          }
          deploy main build/site
          deploy admin build/admin

      - name: Smoke tests
        run: |
          set -euo pipefail
          # (into files first: "curl | grep -q" ends with a write error under pipefail)
          curl --fail --silent --show-error -o index.out "$SITE_URL/"
          grep -q 'html' index.out
          curl --fail --silent --show-error -o env.out "$SITE_URL/js/env-config.js"
          grep -q "$LOKMANGAL_API_BASE" env.out
          # the public website has NO admin panel, only the pointer to the admin address
          curl --fail --silent --show-error -o moved.out "$SITE_URL/admin/"
          grep -q 'admin.lokmangal.info' moved.out
          ! grep -q 'login-overlay' moved.out
          # the admin panel site: root -> /admin/, the page itself, its scripts and settings
          curl --fail --silent --show-error -o root.out "$ADMIN_URL/"
          grep -q '/admin/' root.out
          curl --fail --silent --show-error -o adm.out "$ADMIN_URL/admin/"
          grep -q 'login-overlay' adm.out
          curl --fail --silent --show-error -o /dev/null "$ADMIN_URL/admin/admin.js"
          curl --fail --silent --show-error -o aenv.out "$ADMIN_URL/js/env-config.js"
          grep -q "$LOKMANGAL_API_BASE" aenv.out
          grep -q "$SITE_BASE" aenv.out

  backend:
    name: Backend -> EC2
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send backend/ to the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::notice::Backend deploy skipped: the repository secrets DEPLOY_SSH_KEY / DEPLOY_KNOWN_HOSTS are not set (deploy/SHARED-SERVER.md)."
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -czf - -C backend --exclude=__pycache__ --exclude=tests --exclude=tmp_uploads --exclude='.env' --exclude=.pytest_cache . \
            | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "lokdeploy@$SERVER_HOST" deploy
          curl --fail --silent --show-error -o health.out "$LOKMANGAL_API_BASE/api/health"
          grep -q '"success":true' health.out
