# Deploys when something is pushed to main - after the CI checks passed:
#   website  -> AWS Amplify, TWO sites from one push (a zip of each is uploaded; GitHub signs in to AWS with OIDC: no AWS key is stored):
#                 branch "main"  = the public website (frontend/ without the admin panel)  -> https://www.lokmangal.info
#                 branch "admin" = the admin panel only (its own address, its own browser origin) -> https://admin.lokmangal.info
#   backend  -> the EC2 server (a tar.gz of backend/ goes over SSH to /opt/lokportal/deploy-entry.sh, which builds the image, applies
#               additive database changes, switches the container and rolls back by itself when the new version does not answer).
#               Needs the repository secrets DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS (see deploy/SHARED-SERVER.md); without them this job only prints a note.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']          # a change of the documentation alone does not redeploy anything
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ROLE_ARN: arn:aws:iam::888544051752:role/lokportal-github-deploy
  AMPLIFY_APP_ID: d3c5tglr8un3e
  # (checked after every deploy through Amplify's own addresses, so a DNS problem can not fail a deploy)
  SITE_URL: https://main.d3c5tglr8un3e.amplifyapp.com
  ADMIN_URL: https://admin.d3c5tglr8un3e.amplifyapp.com
  # public values: the addresses the pages use
  LOKMANGAL_API_BASE: https://api.lokmangal.info
  # "1" = the website names a story by the words of its title (/blog/<words>, /rajkiy/<words> ...) instead of ?post=12. Needs the Amplify rules of the step
  # "Addresses of the stories" below (they are set whatever this says) and a backend that has /api/page/ (backend/seo.py). Back to "0" = the old addresses again.
  LOKMANGAL_PRETTY_URLS: "0"
  SITE_BASE: https://www.lokmangal.info
  SERVER_HOST: 13.205.79.72

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  website:
    name: Website + Admin -> Amplify
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The sitemap of the website lists every story and weekly issue: it is written from the live API (/api/sitemap.xml) while the site is built, so
      # Google's Search Console shows them under the website's own address. When the API does not answer, the sitemap.xml of the repository (Home and
      # the sections) is deployed instead - this step never fails a deploy. Stories added later in the Admin Panel reach Google at once through the
      # API's own sitemap (the second Sitemap line of robots.txt).
      - name: Sitemap of the website from the live API
        run: |
          if curl --fail --silent --show-error --max-time 40 --retry 2 --retry-delay 3 -o api-sitemap.xml "$LOKMANGAL_API_BASE/api/sitemap.xml" \
             && grep -q '<urlset' api-sitemap.xml && grep -q "<loc>$SITE_BASE/</loc>" api-sitemap.xml; then
            cp api-sitemap.xml frontend/sitemap.xml
            # the same addresses as a plain text sitemap (one address per line): the simplest format, a second way for Google to read them
            grep -o '<loc>[^<]*</loc>' frontend/sitemap.xml | sed -e 's#<loc>##' -e 's#</loc>##' > frontend/sitemap.txt
            echo "sitemap.xml: $(grep -o '<loc>' frontend/sitemap.xml | wc -l) addresses from the API; sitemap.txt: $(wc -l < frontend/sitemap.txt) lines"
          else
            echo "::warning::The API sitemap could not be read; the sitemap.xml of the repository (Home and the sections) is deployed instead."
          fi
      # (the AWS role trusts exactly: this repository, branch main. A job with `environment:` would present a different identity.)
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build the two sites
        run: |
          set -euo pipefail
          rm -rf build && mkdir -p build/site build/admin
          # public website: everything except the admin panel (a small page sends old /admin/ bookmarks to the admin address)
          rsync -a --exclude '/admin/' frontend/ build/site/
          mkdir -p build/site/admin && cp deploy/amplify/admin-moved.html build/site/admin/index.html
          node deploy/amplify/write-env-config.js build/site/js/env-config.js
          # admin panel: only what it needs - its own files, the settings and the logo. (The pictures of the news are read from the website.)
          mkdir -p build/admin/admin build/admin/js build/admin/assets
          cp frontend/admin/* build/admin/admin/
          cp frontend/js/config.js build/admin/js/
          cp frontend/assets/logo-icon.png build/admin/assets/
          cp deploy/amplify/admin-root.html build/admin/index.html
          printf 'User-agent: *\nDisallow: /\n' > build/admin/robots.txt
          LOKMANGAL_SITE_BASE="$SITE_BASE" node deploy/amplify/write-env-config.js build/admin/js/env-config.js
          echo "site files: $(find build/site -type f | wc -l)   admin files: $(find build/admin -type f | wc -l)"

      - name: Security and cache headers (customHttp.yml is the source of truth)
        run: aws amplify update-app --app-id "$AMPLIFY_APP_ID" --custom-headers "$(cat customHttp.yml)" --query 'app.appId' --output text

      # The addresses of the stories (/blog/<words of the title>, /rajkiy/<words>, /samajik/<words>, /review/<words>, /weekly/68) are answered by Amplify rules: a
      # story's address is passed on to the API, which answers with the website's index.html that has that story in it (backend/seo.py, /api/page/...); a
      # section's address (/blog, /weekly ...) is the website's index.html. The rules the Amplify app already has (the /admin one ...) are read first and kept
      # exactly as they are: only rules with the sources below are added / replaced, at the end of the list. Nothing is changed when the rules cannot be read
      # or are already as wanted, and a failure here never fails the deploy. (The previous list is printed in the log, to put back by hand if ever needed.)
      # Whether the website USES these addresses is decided by LOKMANGAL_PRETTY_URLS above, not by this step.
      - name: Addresses of the stories (Amplify rules)
        continue-on-error: true
        run: |
          set -uo pipefail
          cat > ours.json <<EOF
          [
            {"source": "/blog/<*>",    "target": "$LOKMANGAL_API_BASE/api/page/blog/<*>",    "status": "200"},
            {"source": "/rajkiy/<*>",  "target": "$LOKMANGAL_API_BASE/api/page/rajkiy/<*>",  "status": "200"},
            {"source": "/samajik/<*>", "target": "$LOKMANGAL_API_BASE/api/page/samajik/<*>", "status": "200"},
            {"source": "/review/<*>",  "target": "$LOKMANGAL_API_BASE/api/page/review/<*>",  "status": "200"},
            {"source": "/weekly/<*>",  "target": "$LOKMANGAL_API_BASE/api/page/weekly/<*>",  "status": "200"},
            {"source": "/blog",        "target": "/index.html", "status": "200"},
            {"source": "/rajkiy",      "target": "/index.html", "status": "200"},
            {"source": "/samajik",     "target": "/index.html", "status": "200"},
            {"source": "/review",      "target": "/index.html", "status": "200"},
            {"source": "/weekly",      "target": "/index.html", "status": "200"}
          ]
          EOF
          aws amplify get-app --app-id "$AMPLIFY_APP_ID" --query 'app.customRules' --output json > current.json \
            || { echo "::warning::The Amplify rules could not be read: they are left as they are."; exit 0; }
          echo "rules before: $(cat current.json)"
          jq -s '(.[0] // []) as $cur | .[1] as $ours | ($ours | map(.source)) as $mine
                 | (($cur | map(select(.source as $s | ($mine | index($s)) == null))) + $ours)
                 | map(with_entries(select(.value != null)))' current.json ours.json > merged.json
          if [ "$(jq -cS . merged.json)" = "$(jq -cS '(. // []) | map(with_entries(select(.value != null)))' current.json)" ]; then
            echo "The rules are already as wanted."
          else
            aws amplify update-app --app-id "$AMPLIFY_APP_ID" --custom-rules file://merged.json --query 'app.appId' --output text
            echo "rules after: $(cat merged.json)"
          fi

      - name: Upload and publish both sites
        run: |
          set -euo pipefail
          deploy() {   # $1 = Amplify branch, $2 = folder
            (cd "$2" && zip -qr "../$1.zip" .)
            read -r JOB_ID UPLOAD_URL < <(aws amplify create-deployment --app-id "$AMPLIFY_APP_ID" --branch-name "$1" --query '[jobId,zipUploadUrl]' --output text)
            curl --fail --silent --show-error -T "build/$1.zip" "$UPLOAD_URL"
            aws amplify start-deployment --app-id "$AMPLIFY_APP_ID" --branch-name "$1" --job-id "$JOB_ID" --query 'jobSummary.status' --output text
            local STATUS=""
            for i in $(seq 1 60); do
              STATUS=$(aws amplify get-job --app-id "$AMPLIFY_APP_ID" --branch-name "$1" --job-id "$JOB_ID" --query 'job.summary.status' --output text)
              echo "$1 deployment $JOB_ID: $STATUS"
              case "$STATUS" in
                SUCCEED) return 0 ;;
                FAILED|CANCELLED) echo "::error::Amplify deployment of $1 $STATUS"; return 1 ;;
              esac
              sleep 10
            done
            echo "::error::Amplify deployment of $1 did not finish in time"; return 1
          }
          deploy main build/site
          deploy admin build/admin

      - name: Smoke tests
        run: |
          set -euo pipefail
          # (into files first: "curl | grep -q" ends with a write error under pipefail)
          curl --fail --silent --show-error -o index.out "$SITE_URL/"
          grep -q 'html' index.out
          curl --fail --silent --show-error -o env.out "$SITE_URL/js/env-config.js"
          grep -q "$LOKMANGAL_API_BASE" env.out
          # the public website has NO admin panel, only the pointer to the admin address
          curl --fail --silent --show-error -o moved.out "$SITE_URL/admin/"
          grep -q 'admin.lokmangal.info' moved.out
          ! grep -q 'login-overlay' moved.out
          # the admin panel site: root -> /admin/, the page itself, its scripts and settings
          curl --fail --silent --show-error -o root.out "$ADMIN_URL/"
          grep -q '/admin/' root.out
          curl --fail --silent --show-error -o adm.out "$ADMIN_URL/admin/"
          grep -q 'login-overlay' adm.out
          curl --fail --silent --show-error -o /dev/null "$ADMIN_URL/admin/admin.js"
          curl --fail --silent --show-error -o aenv.out "$ADMIN_URL/js/env-config.js"
          grep -q "$LOKMANGAL_API_BASE" aenv.out
          grep -q "$SITE_BASE" aenv.out

      # (information only: does a story's pretty address answer? The API deploy runs at the same time, so it may need a minute to catch up.)
      - name: Check a story address
        continue-on-error: true
        run: |
          set -uo pipefail
          SLUG=$(curl --silent --max-time 30 "$LOKMANGAL_API_BASE/api/articles?category=blogs&limit=1" | jq -r '.articles[0].slug // empty')
          if [ -z "$SLUG" ]; then echo "No story with words in its address yet: nothing to check."; exit 0; fi
          CODE=$(curl --silent --max-time 40 -o story.out -w '%{http_code}' "$SITE_URL/blog/$SLUG")
          if [ "$CODE" = "200" ] && grep -q 'og:title' story.out; then echo "OK: $SITE_URL/blog/$SLUG answers with the story's page"; else echo "::warning::$SITE_URL/blog/$SLUG answered $CODE (the API may still be starting, or the rules are not in place)"; fi

  backend:
    name: Backend -> EC2
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send backend/ to the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::notice::Backend deploy skipped: the repository secrets DEPLOY_SSH_KEY / DEPLOY_KNOWN_HOSTS are not set (deploy/SHARED-SERVER.md)."
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -czf - -C backend --exclude=__pycache__ --exclude=tests --exclude=tmp_uploads --exclude='.env' --exclude=.pytest_cache . \
            | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "lokdeploy@$SERVER_HOST" deploy
          curl --fail --silent --show-error -o health.out "$LOKMANGAL_API_BASE/api/health"
          grep -q '"success":true' health.out
