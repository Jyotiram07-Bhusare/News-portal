# /etc/nginx/conf.d/lokmangal-api.conf   (bootstrap.sh replaces __API_DOMAIN__)
# nginx is the public door of the API: it speaks HTTPS (certbot adds the certificate), keeps slow uploads away from gunicorn and
# limits request rates. gunicorn itself only listens on 127.0.0.1:5000.
server {
    listen 80;
    listen [::]:80;
    server_name __API_DOMAIN__;

    server_tokens off;
    limit_req_status 429;

    # largest upload: a 200 MB video (MAX_VIDEO_MB) + the form around it
    client_max_body_size 220m;
    client_body_timeout 300s;
    send_timeout 120s;

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # the real client address and protocol go to the app (TRUSTED_PROXIES=1)
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_connect_timeout 5s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    location = /api/auth/login {
        limit_req zone=lokmangal_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:5000;
    }

    location /api/ {
        limit_req zone=lokmangal_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:5000;
    }

    # the load balancer / uptime monitors may ask this
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:5000/api/health;
    }

    # nothing else is public
    location / {
        return 404;
    }
}
