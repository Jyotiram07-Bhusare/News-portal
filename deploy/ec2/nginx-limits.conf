# Installed as /etc/nginx/conf.d/lokmangal-limits.conf (http context): request-rate limits used by nginx-api.conf
limit_req_zone $binary_remote_addr zone=lokmangal_api:10m rate=20r/s;      # everything under /api/
limit_req_zone $binary_remote_addr zone=lokmangal_login:10m rate=10r/m;    # password guesses (the app locks an address after 5 wrong tries as well)
