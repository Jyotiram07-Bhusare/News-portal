# The news portal API on the shared EC2 server. Installed as /opt/lokportal/docker-compose.yml by setup-server.sh.
# Only ONE host port is used (8445; CloudFront is the only visitor). Nothing of the other projects on the server is touched.
name: lokportal

services:
  api:
    image: lokportal-api:current
    container_name: lokportal-api
    restart: unless-stopped
    volumes:
      - /opt/lokportal/backend.env:/app/.env:ro          # settings + secrets (root / deploy user only)
    environment:
      GUNICORN_WORKERS: "2"                               # the server is shared: keep it small
      GUNICORN_THREADS: "4"
      FORWARDED_ALLOW_IPS: "*"                            # only the proxy container can reach this port
    networks: [lokportal]
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 200
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  proxy:
    image: nginx:1.27-alpine
    container_name: lokportal-proxy
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "8445:8445"
    volumes:
      - /opt/lokportal/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [lokportal]
    mem_limit: 128m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  lokportal: {}
