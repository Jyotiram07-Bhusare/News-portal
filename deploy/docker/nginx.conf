# /opt/lokportal/nginx.conf (setup-server.sh replaces __ORIGIN_SECRET__)
# The door of the API container. Visitors never come here directly: CloudFront (https://api.<domain>) does, and sends the secret header
# below. A request without it (a scanner hitting the IP address) gets 403. TLS is ended at CloudFront.
#
# This file is included inside http { } of the nginx image.

# The real visitor: CloudFront writes the viewer's address LAST into X-Forwarded-For (anything the visitor put in front of it is ignored).
# $remote_addr would be the CloudFront edge server, shared by many visitors.
map $http_x_forwarded_for $viewer {
    "~(?<ip>[^,\s]+)\s*$"  $ip;
    default                $remote_addr;
}

# An upload without any login header is turned away before its body is read. (A browser's pre-check, OPTIONS, never carries the login header:
# it must get through, or no upload from the Admin Panel can start.)
map "$request_method|$http_authorization" $upload_no_login {
    default         0;
    "~^OPTIONS\|"   0;
    "~\|$"          1;
}

limit_req_zone $viewer zone=lokportal_api:10m   rate=30r/s;      # everything under /api/
limit_req_zone $viewer zone=lokportal_login:10m rate=30r/m;      # password guesses (the application also locks an address after 5 wrong tries)
limit_conn_zone $server_name zone=lokportal_upload:1m;           # uploads running at the same moment (all visitors together)

log_format lokportal '$viewer [$time_local] "$request" $status $body_bytes_sent rt=$request_time "$http_user_agent"';

server {
    listen 8445 default_server;
    listen [::]:8445 default_server;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log lokportal;

    # Every request body is first written to the server's disk by nginx, BEFORE the application can say "please sign in" - so the default is
    # small, and only the three upload addresses below may carry a big body (and only two of them at a time).
    client_max_body_size 2m;
    client_body_timeout 300s;
    send_timeout 120s;

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    # (one header, not two: the application sends it as well)
    proxy_hide_header X-Content-Type-Options;
    add_header X-Content-Type-Options nosniff always;
    limit_req_status 429;
    limit_conn_status 429;

    # only CloudFront knows the secret
    if ($http_x_origin_verify != "__ORIGIN_SECRET__") {
        return 403;
    }

    # Docker's own DNS, asked again every 10 s: the API container may be replaced by a new one (new address) at any deploy
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:5000;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;    # "visitor, cloudfront": the app trusts 2 proxies (TRUSTED_PROXIES=2)
    proxy_set_header X-Forwarded-Proto $http_cloudfront_forwarded_proto;
    proxy_set_header X-Origin-Verify   "";                            # (the secret stays here, the application does not need it)
    proxy_set_header Connection        "";
    proxy_connect_timeout 5s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    location = /api/auth/login {
        limit_req zone=lokportal_login burst=10 nodelay;
        proxy_pass $api;
    }

    # Uploads (the Admin Panel): bigger bodies, two at a time, and not even started without a login header
    # (the application checks the token itself; this only keeps anonymous big bodies off the disk)
    location ~ ^/api/upload/(image|pdf)$ {
        client_max_body_size 55m;                                     # MAX_UPLOAD_MB (50) + the form around the file
        limit_conn lokportal_upload 2;
        default_type application/json;
        if ($upload_no_login) { return 401 '{"success":false,"error":"Please sign in.","login_required":true}'; }
        proxy_pass $api;
    }

    location = /api/upload/video {
        client_max_body_size 205m;                                    # MAX_VIDEO_MB (200) + the form around the file
        limit_conn lokportal_upload 2;
        default_type application/json;
        if ($upload_no_login) { return 401 '{"success":false,"error":"Please sign in.","login_required":true}'; }
        proxy_pass $api;
    }

    location /api/ {
        limit_req zone=lokportal_api burst=100 nodelay;
        proxy_pass $api;
    }

    # nothing else is public
    location / {
        return 404;
    }
}
