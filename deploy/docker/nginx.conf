# /opt/lokportal/nginx.conf (setup-server.sh replaces __ORIGIN_SECRET__)
# The door of the API container. Visitors never come here directly: CloudFront (https://xxxx.cloudfront.net) does, and sends the secret header
# below. A request without it (a scanner hitting the IP address) gets 403. TLS is ended at CloudFront; when the portal has its own domain
# this can become a TLS origin (DEPLOY.md, "Own domain").
limit_req_zone $binary_remote_addr zone=lokportal_api:10m rate=200r/s;     # CloudFront addresses are shared by many visitors: coarse guard only,
limit_req_zone $binary_remote_addr zone=lokportal_login:10m rate=60r/m;    # the exact login limit (5 tries / 15 min per visitor) is in the application

server {
    listen 8445 default_server;
    listen [::]:8445 default_server;
    server_name _;
    server_tokens off;

    # largest upload: a 200 MB video (MAX_VIDEO_MB) + the form around it
    client_max_body_size 220m;
    client_body_timeout 300s;
    send_timeout 120s;

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    limit_req_status 429;

    # only CloudFront knows the secret
    if ($http_x_origin_verify != "__ORIGIN_SECRET__") {
        return 403;
    }

    # Docker's own DNS, asked again every 10 s: the API container may be replaced by a new one (new address) at any deploy
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:5000;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;    # "visitor, cloudfront": the app trusts 2 proxies (TRUSTED_PROXIES=2)
    proxy_set_header X-Forwarded-Proto $http_cloudfront_forwarded_proto;
    proxy_set_header Connection        "";
    proxy_connect_timeout 5s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    location = /api/auth/login {
        limit_req zone=lokportal_login burst=20 nodelay;
        proxy_pass $api;
    }

    location /api/ {
        limit_req zone=lokportal_api burst=200 nodelay;
        proxy_pass $api;
    }

    # nothing else is public
    location / {
        return 404;
    }
}
